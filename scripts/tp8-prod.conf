# TP8 + V41 现役起服配置（固定路径的唯一真源；2026-10-25 起，= replica1）
# 由 scripts/tp8/tp8_up.sh 读取（bash source）。改这里 = 改现役配置：须先在 docs/ai-industry/compute-economics/tp8-boot-path.md 记一笔。

# 引擎底版（head 上，窗口 1,000,000 / 最大输出 100,000 / 最大并发 8 / KV 8,000,256）
BASE_ENV=/home/deploy/knapcio-v24/.env.tp4.clean-best3

# 镜像（八台各自本地已有；见 tp8-boot-path.md「镜像」节）
IMAGE=dsv41-4x-spark:canary-roce-z2

# chain_variant2.sh 的 KEY=VAL / X:KEY=VAL 参数（X: 前缀 = 容器环境变量）
CHAIN_ARGS=(
  X:DSV41_WO_A_TP8=1
  X:DSV41_VERIFY_CAP_BS=3-16:0.2
  X:DSV41_SHARED_PAD_K_SRC=288
  X:DSV41_PREFILL_WOB_A2A=1
  X:DSV41_PREFILL_QKV_LOCAL=1
  X:DSV41_PREFILL_SKIP_NONFINAL=1
  X:DSV41_PREFILL_EMBED_LOCAL=1
  X:DSV41_PREFILL_SHARED_SHARD=1
  X:DSV41_PREFILL_SP_ALIGN=1
  X:DSV41_PREFILL_FAIR=1
  X:DSV41_CHAT_ENCODE_OFFLOAD=1
  X:SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION=0
  X:DSV41_HICACHE_WALK_DEDUPE=1
  X:DSV41_RADIX_OFFSET_INSERT=1
  X:DSV41_HICACHE_LOCAL_REPLICA=1
  X:SGLANG_HICACHE_FILE_BACKEND_MAX_SIZE=100G
  GLOO_SOCKET_IFNAME=enp1s0f0np0
)

# 起服后必须出现的适配器 ARMED 行（tp8_after.sh 核对；缺一条即报警）
EXPECT_ARMED=(
  "DSV41_PREFILL_FAIR=1 ARMED"
  "DSV41_CHAT_ENCODE_OFFLOAD=1 ARMED"
  "DSV41_HICACHE_WALK_DEDUPE=1 ARMED"
  "DSV41_RADIX_OFFSET_INSERT=1 ARMED"
  "DSV41_HICACHE_LOCAL_REPLICA=1 ARMED"
)

# 八台：RoCE IP（01→.4、02→.3、03→.1、04→.2，注意 02 / 03 是反的）与 ssh 别名
NODES_IP=(10.99.0.4 10.99.0.3 10.99.0.1 10.99.0.2 10.99.0.5 10.99.0.6 10.99.0.7 10.99.0.8)
NODES_SSH=(node-01 node-02 node-03 node-04 node-05 node-06 node-07 node-08)

# head 固定副地址（对外只经它）
HEAD_ADDR=192.0.2.200
HEAD_PORT=8888
